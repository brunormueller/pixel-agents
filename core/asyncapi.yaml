# NOTE: pinned to 3.0.0 deliberately. @asyncapi/modelina v5.10.1 hardcodes
# `supportedVersions: ['3.0.0']` in its AsyncAPIInputProcessor. Bumping to
# 3.1.0 makes Modelina fall through to a generic JSON-schema parser that emits
# only `export type Root = any` instead of our 52 named interfaces. Bump when
# Modelina adds 3.1.0 support; the upgrade is `npx asyncapi convert` + a regen.
# `npm run asyncapi:validate` will keep emitting an info note recommending 3.1.0;
# that's expected and harmless until Modelina catches up.
asyncapi: 3.0.0
info:
  title: Pixel Agents Protocol
  version: 1.0.0
  description: |
    Bidirectional WebSocket protocol between the Pixel Agents server and any UI client
    (the bundled VS Code webview, the standalone browser SPA, or future third-party
    clients). The server watches AI-coding-agent transcripts, parses tool activity, 
    owns office layout, and streams events to all connected clients. 
    Clients send commands to launch agents, save layout, and toggle settings.

    The protocol is provider-agnostic: a HookProvider implementation defines how raw
    CLI events are normalized to the AgentEvent shape, which the server translates
    into ServerMessage broadcasts.
  license:
    name: MIT
  contact:
    name: Pixel Agents
    url: https://github.com/pablodelucca/pixel-agents

servers:
  local:
    host: 127.0.0.1:3100
    protocol: ws
    description: Local Pixel Agents server (default port 3100)
    pathname: /ws

channels:
  ws:
    address: /ws
    description: |
      Single bidirectional channel. The server pushes ServerMessage events on agent
      lifecycle, tool activity, asset loading, and settings. Clients send
      ClientMessage commands.
    messages:
      ServerMessage:
        $ref: '#/components/messages/ServerMessage'
      ClientMessage:
        $ref: '#/components/messages/ClientMessage'

operations:
  receiveServerMessage:
    action: receive
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ServerMessage'
  sendClientMessage:
    action: send
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ClientMessage'

components:
  messages:
    ServerMessage:
      title: Server-to-client message
      summary: Any message broadcast by the server to connected clients.
      payload:
        $ref: '#/components/schemas/ServerMessage'
    ClientMessage:
      title: Client-to-server message
      summary: Any command sent by a client to the server.
      payload:
        $ref: '#/components/schemas/ClientMessage'

  schemas:
    # ── Top-level discriminated unions ────────────────────────────

    ServerMessage:
      oneOf:
        # Provider capabilities
        - $ref: '#/components/schemas/ProviderCapabilities'
        # Agent lifecycle
        - $ref: '#/components/schemas/AgentCreated'
        - $ref: '#/components/schemas/AgentClosed'
        - $ref: '#/components/schemas/AgentSelected'
        - $ref: '#/components/schemas/ExistingAgents'
        # Agent status / tool activity
        - $ref: '#/components/schemas/AgentStatus'
        - $ref: '#/components/schemas/AgentToolStart'
        - $ref: '#/components/schemas/AgentToolDone'
        - $ref: '#/components/schemas/AgentToolsClear'
        - $ref: '#/components/schemas/AgentToolPermission'
        - $ref: '#/components/schemas/AgentToolPermissionClear'
        # Sub-agent activity
        - $ref: '#/components/schemas/SubagentToolStart'
        - $ref: '#/components/schemas/SubagentToolDone'
        - $ref: '#/components/schemas/SubagentClear'
        - $ref: '#/components/schemas/SubagentToolPermission'
        # Agent Teams
        - $ref: '#/components/schemas/AgentTeamInfo'
        # Context window
        - $ref: '#/components/schemas/AgentContextUsage'
        # Multiplayer
        - $ref: '#/components/schemas/RemotePeers'
        - $ref: '#/components/schemas/ChatMessage'
        - $ref: '#/components/schemas/ChatHistory'
        - $ref: '#/components/schemas/MultiplayerStatus'
        - $ref: '#/components/schemas/RoomLayout'
        - $ref: '#/components/schemas/RoomLayoutRejected'
        - $ref: '#/components/schemas/ProfileLoaded'
        # Meetings (video calls inside the room)
        - $ref: '#/components/schemas/MeetingSignal'
        - $ref: '#/components/schemas/MeetingEvent'
        - $ref: '#/components/schemas/MeetingNotesResult'
        # Games (a match played inside the room)
        - $ref: '#/components/schemas/GameFrame'
        # Integrations (calendar, music)
        - $ref: '#/components/schemas/CalendarState'
        - $ref: '#/components/schemas/SpotifyStatus'
        - $ref: '#/components/schemas/OpenExternalUrl'
        # Web view (a VS Code window opened in a browser)
        - $ref: '#/components/schemas/OfficeInBrowser'
        # Layout
        - $ref: '#/components/schemas/LayoutLoaded'
        # Assets
        - $ref: '#/components/schemas/FurnitureAssetsLoaded'
        - $ref: '#/components/schemas/CharacterSpritesLoaded'
        - $ref: '#/components/schemas/PetSpritesLoaded'
        - $ref: '#/components/schemas/FloorTilesLoaded'
        - $ref: '#/components/schemas/WallTilesLoaded'
        - $ref: '#/components/schemas/CarpetTilesLoaded'
        # Settings & config
        - $ref: '#/components/schemas/SettingsLoaded'
        - $ref: '#/components/schemas/HooksStatus'
        - $ref: '#/components/schemas/HooksConsentRequest'
        - $ref: '#/components/schemas/ExternalAssetDirectoriesUpdated'
        - $ref: '#/components/schemas/AreaMappingsLoaded'
        - $ref: '#/components/schemas/WorkspaceFolders'
        # Diagnostics
        - $ref: '#/components/schemas/AgentDiagnostics'
      discriminator: type

    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WebviewReady'
        - $ref: '#/components/schemas/LaunchAgent'
        - $ref: '#/components/schemas/FocusAgent'
        - $ref: '#/components/schemas/CloseAgent'
        - $ref: '#/components/schemas/SaveAgentSeats'
        - $ref: '#/components/schemas/SaveLayout'
        - $ref: '#/components/schemas/SetSoundEnabled'
        - $ref: '#/components/schemas/SetLastSeenVersion'
        - $ref: '#/components/schemas/SetAlwaysShowLabels'
        - $ref: '#/components/schemas/SetGhostHeadlessAgents'
        - $ref: '#/components/schemas/SetHooksEnabled'
        - $ref: '#/components/schemas/HooksConsentResponse'
        - $ref: '#/components/schemas/SetHooksInfoShown'
        - $ref: '#/components/schemas/SetWatchAllSessions'
        - $ref: '#/components/schemas/ExportLayout'
        - $ref: '#/components/schemas/ImportLayout'
        - $ref: '#/components/schemas/OpenSessionsFolder'
        - $ref: '#/components/schemas/AddExternalAssetDirectory'
        - $ref: '#/components/schemas/RemoveExternalAssetDirectory'
        - $ref: '#/components/schemas/SaveAreaMappings'
        - $ref: '#/components/schemas/SetShowAreas'
        - $ref: '#/components/schemas/RequestDiagnostics'
        - $ref: '#/components/schemas/SendChat'
        - $ref: '#/components/schemas/JoinRoom'
        - $ref: '#/components/schemas/LeaveRoom'
        - $ref: '#/components/schemas/PresenceUpdate'
        - $ref: '#/components/schemas/SaveRoomLayout'
        - $ref: '#/components/schemas/UpdateProfile'
        - $ref: '#/components/schemas/ConfigureCalendar'
        - $ref: '#/components/schemas/SpotifyCommand'
        - $ref: '#/components/schemas/OpenExternal'
        - $ref: '#/components/schemas/CopyWebLink'
        - $ref: '#/components/schemas/UpdateMeetingPresence'
        - $ref: '#/components/schemas/SendMeetingSignal'
        - $ref: '#/components/schemas/SendMeetingEvent'
        - $ref: '#/components/schemas/GenerateMeetingNotes'
        - $ref: '#/components/schemas/UpdateGamePresence'
        - $ref: '#/components/schemas/SendGameFrame'
      discriminator: type

    # ── Server message variants ────────────────────────────────────

    ProviderCapabilities:
      description: |
        Sent once after `webviewReady`, before any agent messages. Tells the client
        which tool names should render with the "reading" animation and which spawn
        sub-agent characters.
      type: object
      additionalProperties: false
      required: [type, readingTools, subagentToolNames]
      properties:
        type:
          const: providerCapabilities
        readingTools:
          type: array
          items:
            type: string
          description: Tool names that should render the reading animation (vs typing).
        subagentToolNames:
          type: array
          items:
            type: string
          description: Tool names that spawn sub-agent characters (e.g. Task, Agent).

    AgentCreated:
      description: A new agent has appeared in the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentCreated
        id:
          type: integer
        folderName:
          type: string
        isExternal:
          type: boolean
        palette:
          type: integer
          description: Server-assigned character palette index.
        hueShift:
          type: integer
          description: Server-assigned hue shift in degrees (0-360).

    AgentClosed:
      description: An agent has been removed from the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentClosed
        id:
          type: integer

    AgentSelected:
      description: An agent's terminal was focused (VS Code only). UI should highlight it.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentSelected
        id:
          type: integer

    ExistingAgents:
      description: |
        Snapshot of all current agents. Sent on initial connect and after agent set
        changes that the client missed. Includes seat/palette assignments.
      type: object
      additionalProperties: false
      required: [type, agents, agentMeta, folderNames, externalAgents]
      properties:
        type:
          const: existingAgents
        agents:
          type: array
          items:
            type: integer
        agentMeta:
          type: object
          description: Map of agent ID (string) to seat metadata.
          additionalProperties:
            $ref: '#/components/schemas/AgentSeatMeta'
        folderNames:
          type: object
          description: Map of agent ID (string) to workspace folder name.
          additionalProperties:
            type: string
        externalAgents:
          type: object
          description: Map of agent ID (string) to external flag.
          additionalProperties:
            type: boolean

    AgentStatus:
      description: Active vs waiting state for an agent (drives character animation).
      type: object
      additionalProperties: false
      required: [type, id, status]
      properties:
        type:
          const: agentStatus
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AgentActivityStatus'
        awaitingInput:
          type: boolean
          description: >-
            Only meaningful when status is "waiting". True when the agent went
            idle waiting on the user (drives the "Waiting for input" label);
            absent/false means the agent finished its turn ("Done").

    AgentActivityStatus:
      description: Activity state of an agent.
      type: string
      enum: [active, waiting]

    AgentToolStart:
      description: Agent began executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId, status]
      properties:
        type:
          const: agentToolStart
        id:
          type: integer
        toolId:
          type: string
        status:
          type: string
          description: Human-readable status to display (e.g. "Reading foo.ts").
        toolName:
          type: string
        permissionActive:
          type: boolean
        runInBackground:
          type: boolean
        isTeammateSpawn:
          type: boolean
          description: >-
            True when this spawn tool call carries a name, making the spawn a
            Teammate-to-be. The office must not create a Subtask sub-character
            for it — a teammate character will represent the spawn instead.

    AgentToolDone:
      description: Agent finished executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId]
      properties:
        type:
          const: agentToolDone
        id:
          type: integer
        toolId:
          type: string

    AgentToolsClear:
      description: All foreground tools cleared (turn end). Background agents preserved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolsClear
        id:
          type: integer

    AgentToolPermission:
      description: Permission prompt detected for the agent's current tool.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermission
        id:
          type: integer

    AgentToolPermissionClear:
      description: Permission prompt resolved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermissionClear
        id:
          type: integer

    SubagentToolStart:
      description: Sub-agent (e.g. Task) started a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId, status]
      properties:
        type:
          const: subagentToolStart
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string
        status:
          type: string

    SubagentToolDone:
      description: Sub-agent finished a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId]
      properties:
        type:
          const: subagentToolDone
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string

    SubagentClear:
      description: A sub-agent task completed.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentClear
        id:
          type: integer
        parentToolId:
          type: string

    SubagentToolPermission:
      description: Permission prompt for a sub-agent's tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentToolPermission
        id:
          type: integer
        parentToolId:
          type: string

    AgentTeamInfo:
      description: Agent Teams metadata (lead, teammate, tmux usage).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentTeamInfo
        id:
          type: integer
        teamName:
          type: string
        agentName:
          type: string
        isTeamLead:
          type: boolean
        leadAgentId:
          type: integer
        teamUsesTmux:
          type: boolean

    AgentContextUsage:
      description: |
        How much of the agent's context window is in use, as of its most recent
        turn. A snapshot, NOT a running total: it falls when the session
        compacts or clears. `maxContextTokens` is the runtime's best estimate of
        the window size — transcripts don't state it, so it starts at the
        default and widens (never shrinks) once a larger context is observed.
        Sent for every agent, including leads and teammates; sub-agents have no
        session of their own and never report it.
      type: object
      additionalProperties: false
      required: [type, id, contextTokens, maxContextTokens]
      properties:
        type:
          const: agentContextUsage
        id:
          type: integer
        contextTokens:
          type: integer
        maxContextTokens:
          type: integer

    RemotePeers:
      description: |
        Multiplayer snapshot: every OTHER office in the relay room and its agents.
        Always the full picture (a peer missing from the list has left), so the
        client reconciles rather than applies deltas. Empty when multiplayer is
        off or the relay connection dropped. Remote agent ids are only unique
        within their peer — key characters by (peerId, id).
      type: object
      additionalProperties: false
      required: [type, peers]
      properties:
        type:
          const: remotePeers
        peers:
          type: array
          items:
            $ref: '#/components/schemas/RemotePeer'

    RemoteActivity:
      description: Which animation a remote agent's current tool plays.
      type: string
      enum: [typing, reading]

    RemotePeer:
      description: One other office in the multiplayer room.
      type: object
      additionalProperties: false
      required: [peerId, name, agents]
      properties:
        peerId:
          type: string
        name:
          type: string
          description: Display name the peer chose (sanitized, at most 32 characters).
        agents:
          type: array
          items:
            $ref: '#/components/schemas/RemoteAgent'
        desk:
          description: Seat uid of the room layout this office claimed as its desk; null when none.
          oneOf:
            - type: string
            - type: 'null'
        since:
          type: integer
          description: |
            Relay clock when the office joined, ms since epoch. Two offices
            claiming the same desk: the earlier `since` keeps it.
        profile:
          $ref: '#/components/schemas/PeerProfile'
        meeting:
          $ref: '#/components/schemas/MeetingPresence'
        game:
          $ref: '#/components/schemas/GamePresence'

    PeerProfile:
      description: |
        What the person in an office chose to show the room about themselves:
        how their character looks, a status, the decoration on their desk and —
        only while they turned sharing on — the song they are listening to.
        Sanitized by the relay and again by every office that receives it.
      type: object
      additionalProperties: false
      properties:
        look:
          $ref: '#/components/schemas/AvatarLook'
        status:
          $ref: '#/components/schemas/PersonStatus'
        statusText:
          type: string
          description: Custom status message (control and bidi characters stripped, at most 60 characters).
        music:
          description: What the person is listening to; absent/null = nothing shared.
          oneOf:
            - $ref: '#/components/schemas/SharedTrack'
            - type: 'null'
        decor:
          type: array
          items:
            $ref: '#/components/schemas/DeskDecorItem'
        deskStyle:
          type: string
          description: Style the person's desk and chair are drawn in (a desk style id, e.g. CURVED_DESK), instead of the room's.
        hidden:
          type: array
          description: Uids of room-layout items standing on the person's desk that they took off (the computer it came with).
          items:
            type: string

    AvatarLook:
      description: |
        The person's character. `body` picks the base sprite (skin, hair style,
        cut of the clothes); `hair`, `top` and `bottom` index the webview's color
        swatches, -1 keeping the sprite's own colors; `accessory` is drawn over
        the head.
      type: object
      additionalProperties: false
      required: [body, hair, top, bottom, accessory]
      properties:
        body:
          type: integer
        hair:
          type: integer
        top:
          type: integer
        bottom:
          type: integer
        accessory:
          $ref: '#/components/schemas/AvatarAccessory'

    AvatarAccessory:
      type: string
      enum:
        [
          none,
          cap,
          beanie,
          tophat,
          crown,
          partyhat,
          headphones,
          glasses,
          sunglasses,
          flower,
          bow,
          halo,
        ]

    PersonStatus:
      description: |
        available/busy/away are chosen by the person; meeting is also set on its
        own while a calendar event is in progress (when the calendar is allowed to).
      type: string
      enum: [available, busy, meeting, away]

    SharedTrack:
      description: A song, as the room sees it. `trackUrl` is only ever an open.spotify.com track link.
      type: object
      additionalProperties: false
      required: [title, artist]
      properties:
        title:
          type: string
        artist:
          type: string
        trackUrl:
          type: string

    DeskDecorItem:
      description: |
        A decoration on the person's desk: a furniture catalog id (a rotation
        variant, so it faces the chair), placed relative to the desk's chair so it
        moves along with the desk: `dc,dr` tiles (at most 3 away) plus, for items
        standing on the tabletop, `px,py` pixels within that tile — the middle of
        the item's base.
      type: object
      additionalProperties: false
      required: [type, dc, dr]
      properties:
        type:
          type: string
        dc:
          type: integer
        dr:
          type: integer
        px:
          type: integer
          description: 0-15.
        py:
          type: integer
          description: 0-15.

    RemotePose:
      description: |
        Where a character stands in the SHARED room layout, and what it is doing.
        Only sent while the room has a shared layout — with per-office layouts a
        position would mean nothing on the other side.
      type: object
      additionalProperties: false
      required: [x, y, dir, state]
      properties:
        x:
          type: number
          description: World pixels.
        y:
          type: number
        dir:
          type: integer
          description: 0 down, 1 left, 2 right, 3 up.
        state:
          $ref: '#/components/schemas/RemotePoseState'
        emote:
          description: Animation or reaction the character is showing; absent/null = none.
          oneOf:
            - $ref: '#/components/schemas/RemoteEmote'
            - type: 'null'
        emoteSeq:
          type: integer
          description: Bumped on every new emote, so the same one twice in a row replays.

    RemoteEmote:
      description: |
        dance/jump/spin move the character (dance loops until stopped); the rest
        are reactions, an emoji floating up from its head.
      type: string
      enum: [dance, jump, spin, wave, heart, clap, laugh, party]

    RemotePoseState:
      description: What the character's sprite is doing (read = the reading animation at a desk).
      type: string
      enum: [idle, walk, type, read]

    RemoteAgent:
      description: |
        An agent of another office, reduced to what animates its character. Tool
        names, arguments, status text and folder names are never shared.
      type: object
      additionalProperties: false
      required: [id, palette, hueShift, status, activity, permission, awaitingInput]
      properties:
        id:
          type: integer
        palette:
          type: integer
        hueShift:
          type: integer
        status:
          $ref: '#/components/schemas/AgentActivityStatus'
        activity:
          description: Animation of the tool in flight; null between tools.
          oneOf:
            - $ref: '#/components/schemas/RemoteActivity'
            - type: 'null'
        permission:
          type: boolean
        awaitingInput:
          type: boolean
        isAvatar:
          type: boolean
          description: |
            The person's own character. The office's first Claude agent IS this
            character, so it keeps one identity while agents come and go.
        pose:
          $ref: '#/components/schemas/RemotePose'

    ChatEntry:
      description: |
        One line of the multiplayer room's chat. Text the person typed for the
        room to read, sanitized by both the relay and the receiving office
        (control and bidi characters stripped, at most 280 characters).
      type: object
      additionalProperties: false
      required: [peerId, name, text, ts, self]
      properties:
        peerId:
          type: string
          description: Sender office; matches `RemotePeer.peerId` for other offices.
        name:
          type: string
        text:
          type: string
        ts:
          type: integer
          description: Relay clock when the message was fanned out, ms since epoch.
        self:
          type: boolean
          description: Sent by this office (the bubble goes over a local character).

    ChatMessage:
      description: |
        A new chat line from the multiplayer room, this office's own included
        (the relay echoes it back as the delivery receipt).
      type: object
      additionalProperties: false
      required: [type, message]
      properties:
        type:
          const: chatMessage
        message:
          $ref: '#/components/schemas/ChatEntry'

    ChatHistory:
      description: |
        The chat lines this office received since it started (in memory only,
        oldest first), replayed on `webviewReady`. Only sent when multiplayer is
        configured, so its arrival is also what enables the chat UI.
      type: object
      additionalProperties: false
      required: [type, messages]
      properties:
        type:
          const: chatHistory
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatEntry'

    MultiplayerStatus:
      description: |
        The office's place in multiplayer. `available` = the office can join a
        room (always, today); `room`/`name`/`relayUrl` prefill the join screen
        (the last ones used) even before joining. `layoutOwner` = this office created a
        room that had no map, so the room starts with ITS layout (on an older
        relay it also stays the only office that may edit the map).
      type: object
      additionalProperties: false
      required: [type, available, joined, connected, room, name, relayUrl, layoutOwner]
      properties:
        type:
          const: multiplayerStatus
        available:
          type: boolean
        joined:
          type: boolean
        connected:
          type: boolean
        room:
          type: string
        name:
          type: string
        relayUrl:
          type: string
          description: |
            The relay the join screen starts from: typed there last time, from
            multiplayer.json, `--relay`, or the build's default. Empty = none
            known, the join screen asks for it.
        layoutOwner:
          type: boolean
        since:
          type: integer
          description: Relay clock when this office joined (compare with RemotePeer.since for a contested desk).
        peerId:
          type: string
          description: This office's id in the room (the `from` other offices see on its meeting signals); empty while disconnected.
        clockOffset:
          type: integer
          description: |
            Relay clock minus this machine's clock, ms (estimated at join). Meeting
            timestamps (join times, raised hands, the music's start) are relay
            clock, so every office in a meeting orders and times them alike.
        iceServers:
          type: array
          description: |
            STUN/TURN servers for meeting media (WebRTC): the relay's, then the
            ones in multiplayer.json. Empty = the webview's public STUN default.
          items:
            $ref: '#/components/schemas/IceServer'

    RoomLayout:
      description: |
        The room's shared layout, shown INSTEAD of this office's own while joined
        and never written to its layout.json. Null = no shared layout (not
        joined, or none published yet): show your own layout. With `rev` the
        map is everyone's: edits go out as `saveRoomLayout`, and every new
        revision (anyone's, ours included) arrives as another `roomLayout`.
      type: object
      additionalProperties: false
      required: [type, layout, editable]
      properties:
        type:
          const: roomLayout
        layout:
          oneOf:
            - type: object
              description: Opaque OfficeLayout, sanitized by the relay and the office.
            - type: 'null'
        editable:
          type: boolean
          description: |
            The layout editor may open: on this office's own layout, or on a room
            map with `rev`. False = an older relay's room map, which only its
            creator edits.
        rev:
          type: integer
          description: Revision of the room map (present when anyone in the room may edit it).
        editId:
          type: string
          description: The `saveRoomLayout` edit that made this revision, when one just landed.

    RoomLayoutRejectReason:
      description: |
        `stale`: the map moved on first (the page merges the newer map in and
        retries); `busy`: too many edits too fast; `replaced`: a newer edit from
        this office superseded it before it was sent; `offline`: no relay
        connection; `invalid`: not a layout the room accepts; `forbidden`: an
        untokened page (standalone) may not edit the room.
      type: string
      enum: [stale, busy, replaced, offline, invalid, forbidden]

    RoomLayoutRejected:
      description: An edit of the room's map (`saveRoomLayout`) did not land.
      type: object
      additionalProperties: false
      required: [type, editId, rev, reason]
      properties:
        type:
          const: roomLayoutRejected
        editId:
          type: string
        rev:
          type: integer
          description: The room map's revision as this office knows it.
        reason:
          $ref: '#/components/schemas/RoomLayoutRejectReason'

    ProfileLoaded:
      description: |
        This office's own profile as saved in ~/.pixel-agents/multiplayer-profile.json:
        the avatar look (null = none chosen yet), status, desk decoration and
        whether the song playing is shared with the room. Sent on webviewReady
        and after every `updateProfile`. Only when multiplayer is configured.
      type: object
      additionalProperties: false
      required: [type, look, status, statusText, decor, shareMusic, desk, deskStyle, hidden]
      properties:
        type:
          const: profileLoaded
        desk:
          description: The desk this office last claimed in the current room (a seat uid), to sit at again; null when none.
          oneOf:
            - type: string
            - type: 'null'
        look:
          oneOf:
            - $ref: '#/components/schemas/AvatarLook'
            - type: 'null'
        status:
          $ref: '#/components/schemas/PersonStatus'
        statusText:
          type: string
        decor:
          type: array
          items:
            $ref: '#/components/schemas/DeskDecorItem'
        shareMusic:
          type: boolean
        deskStyle:
          oneOf:
            - type: string
            - type: 'null'
        hidden:
          type: array
          items:
            type: string

    IceServer:
      description: One WebRTC ICE server (RTCIceServer).
      type: object
      additionalProperties: false
      required: [urls]
      properties:
        urls:
          type: array
          items:
            type: string
          description: 'stun:, turn: or turns: URLs.'
        username:
          type: string
        credential:
          type: string

    MeetingPresence:
      description: |
        This office's person in a meeting — a video call inside the room. Each
        office publishes its own presence with its state frame; a meeting is
        simply every office publishing the same `id`. Media never passes the
        relay (browser to browser, WebRTC); this only says who is in the call
        and what they are sending. `transcribe` and `music` are meeting-wide
        switches every participant replicates: the newest `at` wins.
      type: object
      additionalProperties: false
      required: [id, title, since, mic, cam, screens, hand, rec, captions]
      properties:
        id:
          type: string
          description: Meeting id (letters, digits, - and _; at most 64).
        title:
          type: string
          description: At most 60 characters.
        since:
          type: integer
          description: Relay clock when this person joined the call. Also names this join (a rejoin is a new connection).
        mic:
          type: boolean
        cam:
          type: boolean
        stream:
          type: string
          description: Id of the MediaStream carrying the microphone and camera (WebRTC msid).
        screens:
          type: array
          description: The screens this person shares, at most 4 at once.
          items:
            $ref: '#/components/schemas/MeetingScreen'
        hand:
          type: boolean
        handAt:
          type: integer
          description: Relay clock when the hand went up (the order hands are taken in).
        rec:
          type: boolean
          description: This person is recording the meeting (everyone sees it).
        captions:
          type: boolean
          description: This person's speech is being transcribed for the meeting.
        transcribe:
          $ref: '#/components/schemas/MeetingSwitch'
        music:
          $ref: '#/components/schemas/MeetingMusic'

    MeetingScreen:
      type: object
      additionalProperties: false
      required: [stream]
      properties:
        stream:
          type: string
          description: MediaStream id of the shared screen.
        label:
          type: string
        audio:
          type: boolean
          description: The share carries the screen's or tab's sound.

    MeetingSwitch:
      description: A meeting-wide on/off everyone replicates; the newest `at` wins.
      type: object
      additionalProperties: false
      required: [on, at]
      properties:
        on:
          type: boolean
        at:
          type: integer
          description: Relay clock of the change.

    MeetingMusic:
      description: |
        The meeting's soundtrack: a built-in track every participant plays
        locally, `at` = relay clock when it started (so all hear the same
        moment). An empty track = stopped. The newest `at` wins.
      type: object
      additionalProperties: false
      required: [track, at]
      properties:
        track:
          type: string
        at:
          type: integer

    MeetingSdp:
      type: object
      additionalProperties: false
      required: [type, sdp]
      properties:
        type:
          $ref: '#/components/schemas/MeetingSdpType'
        sdp:
          type: string

    MeetingSdpType:
      type: string
      enum: [offer, answer, pranswer, rollback]

    MeetingIceCandidate:
      type: object
      additionalProperties: false
      required: [candidate]
      properties:
        candidate:
          type: string
        sdpMid:
          type: string
        sdpMLineIndex:
          type: integer
        usernameFragment:
          type: string

    MeetingSignalKind:
      type: string
      enum: [sdp, ice, invite]

    MeetingSignalData:
      description: |
        WebRTC signaling between two offices in the same meeting, or an invite.
        `sid` names the sender's join (its MeetingPresence.since) and `tsid` the
        receiver's, so a message meant for an earlier join is ignored.
      type: object
      additionalProperties: false
      required: [kind, sid, tsid]
      properties:
        kind:
          $ref: '#/components/schemas/MeetingSignalKind'
        sid:
          type: integer
        tsid:
          type: integer
        description:
          $ref: '#/components/schemas/MeetingSdp'
        candidate:
          $ref: '#/components/schemas/MeetingIceCandidate'
        meetingId:
          type: string
          description: invite only.
        title:
          type: string
          description: invite only.

    MeetingSignal:
      description: A WebRTC signal (or an invite) from another office, relayed to this one only.
      type: object
      additionalProperties: false
      required: [type, from, data]
      properties:
        type:
          const: meetingSignal
        from:
          type: string
          description: Sender's peerId.
        data:
          $ref: '#/components/schemas/MeetingSignalData'

    MeetingEventKind:
      type: string
      enum: [chat, reaction, caption, notes]

    MeetingEventBody:
      description: |
        Something said in a meeting: a chat line, a reaction (an emoji from the
        fixed set), a transcribed sentence, or meeting notes. The relay fans it
        out to the meeting's participants only, the sender included.
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          $ref: '#/components/schemas/MeetingEventKind'
        text:
          type: string

    MeetingEvent:
      type: object
      additionalProperties: false
      required: [type, from, name, meetingId, ts, self, event]
      properties:
        type:
          const: meetingEvent
        from:
          type: string
        name:
          type: string
        meetingId:
          type: string
        ts:
          type: integer
          description: Relay clock when it was fanned out.
        self:
          type: boolean
          description: Sent by this office (the relay's echo is the delivery receipt).
        event:
          $ref: '#/components/schemas/MeetingEventBody'

    MeetingNotesResult:
      description: |
        The answer to `generateMeetingNotes`, to the client that asked. `text` is
        markdown; `savedTo` is the file under ~/.pixel-agents/meetings/ holding
        the notes and the transcript.
      type: object
      additionalProperties: false
      required: [type, requestId, ok]
      properties:
        type:
          const: meetingNotesResult
        requestId:
          type: string
        ok:
          type: boolean
        text:
          type: string
        savedTo:
          type: string
        error:
          type: string

    # ── Games (Pixel Frag, a first-person match inside the room) ──

    GameKind:
      description: Which game a match plays. Pixel Frag (`fps`) is the first.
      type: string
      enum: [fps]

    FpsDifficulty:
      type: string
      enum: [easy, normal, hard]

    FpsConfig:
      description: |
        How a Pixel Frag match plays, chosen by whoever started it and copied by
        everyone who joins (so it outlives its starter).
      type: object
      additionalProperties: false
      required: [map, bots, difficulty, fragLimit, timeLimit]
      properties:
        map:
          type: string
          description: |
            A built-in map id, or `office`: the starter's floor, sent to the others
            as a `map` frame by the match's host.
        bots:
          type: integer
          description: Computer-controlled players (0-8), run by the match's host.
        difficulty:
          $ref: '#/components/schemas/FpsDifficulty'
        fragLimit:
          type: integer
          description: Frags that win a round; 0 = no limit.
        timeLimit:
          type: integer
          description: Minutes per round; 0 = no limit.

    GamePresence:
      description: |
        This office's person in a match — a game played inside the room. Like a
        meeting, a match is every office publishing the same `id`; the one that
        joined earliest (`since`, then peerId) is its host: it runs the bots,
        keeps the score and sends the office map. Re-sent every few seconds; the
        server drops a presence nobody refreshes.
      type: object
      additionalProperties: false
      required: [id, game, title, since, cfg, palette, hueShift]
      properties:
        id:
          type: string
          description: Match id (letters, digits, - and _; at most 64).
        game:
          $ref: '#/components/schemas/GameKind'
        title:
          type: string
          description: At most 60 characters.
        since:
          type: integer
          description: Relay clock when this person joined the match.
        cfg:
          $ref: '#/components/schemas/FpsConfig'
        palette:
          type: integer
          description: Character palette this person plays with.
        hueShift:
          type: integer

    GameFrameKind:
      description: |
        `pos` a player's own state (about 15 a second), `hit` damage one shooter
        dealt one target, `die` a death (the victim's word, or the host's for a
        bot), `bots` + `score` the host's picture of the bots and the round,
        `map` the office map, `req` a newcomer asking for map and score, `take`
        a pickup taken.
      type: string
      enum: [pos, hit, die, bots, score, map, req, take]

    FpsBotState:
      type: object
      additionalProperties: false
      required: [id, n, x, y, a, hp, alive, w, shot, mv, p, h]
      properties:
        id:
          type: string
        n:
          type: string
          description: Name.
        x:
          type: number
        y:
          type: number
        a:
          type: number
          description: Facing, radians.
        hp:
          type: integer
        alive:
          type: boolean
        w:
          type: integer
          description: Weapon slot.
        shot:
          type: integer
          description: Shots fired so far (a new value = a muzzle flash).
        mv:
          type: boolean
          description: Walking.
        p:
          type: integer
          description: Palette.
        h:
          type: integer
          description: Hue shift.

    FpsScoreEntry:
      type: object
      additionalProperties: false
      required: [id, n, f, d]
      properties:
        id:
          type: string
          description: A player's peerId, or a bot id.
        n:
          type: string
        f:
          type: integer
          description: Frags.
        d:
          type: integer
          description: Deaths.
        bot:
          type: boolean

    FpsColorAdjust:
      description: A floor tile's colorization, as the layout stores it.
      type: object
      additionalProperties: false
      required: [h, s, b, c]
      properties:
        h:
          type: number
        s:
          type: number
        b:
          type: number
        c:
          type: number
        colorize:
          type: boolean

    FpsSurface:
      description: |
        A wall or floor texture: a built-in one (`tex`, optionally tinted with
        `tint` = 0xRRGGBB), or an office floor tile (`pat` pattern + `color`).
      type: object
      additionalProperties: false
      properties:
        tex:
          type: string
        tint:
          type: integer
        pat:
          type: integer
        color:
          $ref: '#/components/schemas/FpsColorAdjust'

    FpsBlock:
      description: A waist-high solid block (a desk, a crate) — shot over, walked around.
      type: object
      additionalProperties: false
      required: [h, top, side]
      properties:
        h:
          type: number
          description: Height, wall = 1 (at most 0.45, under the eye).
        top:
          type: integer
          description: 0xRRGGBB of the top.
        side:
          type: integer
          description: 0xRRGGBB of the sides.

    FpsProp:
      description: Something standing in the map, drawn as a sprite (furniture type or built-in prop id).
      type: object
      additionalProperties: false
      required: [x, y, t]
      properties:
        x:
          type: number
        y:
          type: number
        t:
          type: string
        z:
          type: number
          description: Height it stands at (on a desk).

    FpsPoint:
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x:
          type: number
        y:
          type: number

    FpsItemKind:
      type: string
      enum: [health, shells, bullets]

    FpsItem:
      type: object
      additionalProperties: false
      required: [x, y, k]
      properties:
        x:
          type: number
        y:
          type: number
        k:
          $ref: '#/components/schemas/FpsItemKind'

    FpsMapData:
      description: |
        A Pixel Frag map. `cells` has one character per cell, row by row:
        `A`-`Z` a wall (texture `walls[n]`), `a`-`z` floor (`floors[n]`),
        `0`-`9` a waist-high block (`blocks[n]`). `solid` lists the floor cells
        furniture stands on (not walkable). Positions are in cells.
      type: object
      additionalProperties: false
      required:
        [name, cols, rows, cells, walls, floors, blocks, props, solid, spawns, items, ceiling, fog]
      properties:
        name:
          type: string
        cols:
          type: integer
        rows:
          type: integer
        cells:
          type: string
        walls:
          type: array
          items:
            $ref: '#/components/schemas/FpsSurface'
        floors:
          type: array
          items:
            $ref: '#/components/schemas/FpsSurface'
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/FpsBlock'
        props:
          type: array
          items:
            $ref: '#/components/schemas/FpsProp'
        solid:
          type: array
          items:
            type: integer
        spawns:
          type: array
          items:
            $ref: '#/components/schemas/FpsPoint'
        items:
          type: array
          items:
            $ref: '#/components/schemas/FpsItem'
        ceiling:
          type: integer
          description: 0xRRGGBB.
        fog:
          type: integer
          description: 0xRRGGBB things fade into with distance.

    GameFrameBody:
      description: |
        One frame of a match, relayed to the other players of the same match
        only (never the sender). Which fields a frame carries depends on `k`;
        both the relay and every office drop the rest.
      type: object
      additionalProperties: false
      required: [k]
      properties:
        k:
          $ref: '#/components/schemas/GameFrameKind'
        x:
          type: number
        y:
          type: number
        a:
          type: number
        hp:
          type: integer
        alive:
          type: boolean
        w:
          type: integer
        shot:
          type: integer
        mv:
          type: boolean
        to:
          type: string
          description: hit — the target (a peerId or a bot id).
        dmg:
          type: integer
        who:
          type: string
          description: die — the bot that died (absent = the sender died).
        by:
          type: string
          description: |
            die — who scored the frag ('' = nobody); hit — the bot that fired
            (absent = the sender did).
        bots:
          type: array
          items:
            $ref: '#/components/schemas/FpsBotState'
        score:
          type: array
          items:
            $ref: '#/components/schemas/FpsScoreEntry'
        round:
          type: integer
        endsAt:
          type: integer
          description: Relay clock the round ends at; 0 = no time limit.
        over:
          type: boolean
        restartAt:
          type: integer
          description: Relay clock the next round starts at (while `over`).
        items:
          type: string
          description: score — one character per map item, `1` = there to take.
        i:
          type: integer
          description: take — the item index.
        map:
          $ref: '#/components/schemas/FpsMapData'

    GameFrame:
      description: A frame of this office's match from another player, relayed to this office only.
      type: object
      additionalProperties: false
      required: [type, from, gameId, frame]
      properties:
        type:
          const: gameFrame
        from:
          type: string
          description: Sender's peerId.
        gameId:
          type: string
        frame:
          $ref: '#/components/schemas/GameFrameBody'

    CalendarEvent:
      description: |
        One upcoming event from the person's calendar feeds. Stays on this machine:
        nothing about it reaches the room except, optionally, the `meeting` status.
      type: object
      additionalProperties: false
      required: [id, title, start, end, allDay]
      properties:
        id:
          type: string
        title:
          type: string
        start:
          type: integer
          description: ms since epoch.
        end:
          type: integer
        allDay:
          type: boolean
        joinUrl:
          type: string
          description: https link to the video call (Google Meet, Teams, Zoom, Webex...), when the event has one.
        location:
          type: string

    CalendarFeedInfo:
      type: object
      additionalProperties: false
      required: [id, label, ok]
      properties:
        id:
          type: string
        label:
          type: string
          description: Host of the feed (calendar.google.com, outlook.office365.com...) — never the secret URL itself.
        ok:
          type: boolean
        error:
          type: string

    CalendarState:
      description: |
        The calendar integration: configured feeds (host only), the events of the
        next 24 hours, and whether one is in progress. Sent on webviewReady and
        after every sync.
      type: object
      additionalProperties: false
      required: [type, feeds, events, autoStatus, inMeeting]
      properties:
        type:
          const: calendarState
        feeds:
          type: array
          items:
            $ref: '#/components/schemas/CalendarFeedInfo'
        events:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEvent'
        autoStatus:
          type: boolean
          description: Show "In a meeting" to the room while an event is in progress.
        inMeeting:
          type: boolean
        syncedAt:
          type: integer
        error:
          type: string
          description: Why the last change was refused (a malformed address, too many calendars).

    SpotifyTrack:
      type: object
      additionalProperties: false
      required: [title, artist, isPlaying]
      properties:
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        isPlaying:
          type: boolean
        trackUrl:
          type: string
        progressMs:
          type: integer
        durationMs:
          type: integer

    SpotifyStatus:
      description: |
        The Spotify integration. Tokens never leave the server; the webview only
        learns whether it is connected and what is playing. `clientId` is the
        person's own Spotify app (they register `redirectUri` in it).
      type: object
      additionalProperties: false
      required: [type, clientId, redirectUri, connected, pendingAuth, nowPlaying]
      properties:
        type:
          const: spotifyStatus
        clientId:
          type: string
        redirectUri:
          type: string
        connected:
          type: boolean
        pendingAuth:
          type: boolean
        nowPlaying:
          oneOf:
            - $ref: '#/components/schemas/SpotifyTrack'
            - type: 'null'
        error:
          type: string

    OfficeInBrowser:
      description: |
        VS Code: whether this window's office is open in a browser page (its web
        view). While it is, the page there is the person's: the panel publishes
        no position and no meeting presence of its own, and says where to look.
      type: object
      additionalProperties: false
      required: [type, open]
      properties:
        type:
          const: officeInBrowser
        open:
          type: boolean

    OpenExternalUrl:
      description: |
        Standalone only: open this https URL in a new browser tab (the Spotify
        sign-in page). Sent to the one client that asked for it.
      type: object
      additionalProperties: false
      required: [type, url]
      properties:
        type:
          const: openExternalUrl
        url:
          type: string

    LayoutLoaded:
      description: |
        Office layout (tiles, furniture, colors). `null` when no layout file or
        bundled default exists. `wasReset` is true when the bundled default
        replaced an outdated user layout.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: layoutLoaded
        layout:
          oneOf:
            - type: object
              description: |
                Opaque layout object (cols, rows, tiles, furniture, tileColors).
                Format defined by the OfficeLayout schema in webview-ui; not
                modeled here because it's owned by the rendering layer.
            - type: 'null'
        wasReset:
          type: boolean

    FurnitureAssetsLoaded:
      description: Furniture catalog and sprite data, sent once after webviewReady.
      type: object
      additionalProperties: false
      required: [type, catalog, sprites]
      properties:
        type:
          const: furnitureAssetsLoaded
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureAssetMessage'
        sprites:
          type: object
          description: Map of furniture asset ID to its sprite (2D hex string array).
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: string

    CharacterSpritesLoaded:
      description: Pre-colored character sprite sets (6 palettes), sent once at startup.
      type: object
      additionalProperties: false
      required: [type, characters]
      properties:
        type:
          const: characterSpritesLoaded
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterSpriteSet'

    PetSpritesLoaded:
      description: Pet sprite frame sets and display names, sent once after webviewReady (between characterSpritesLoaded and floorTilesLoaded).
      type: object
      additionalProperties: false
      required: [type, pets, petNames]
      properties:
        type:
          const: petSpritesLoaded
        pets:
          type: array
          description: One frame-set per loaded pet, indexed by petType.
          items:
            $ref: '#/components/schemas/PetSpriteFrameSet'
        petNames:
          type: array
          description: Display names parallel-indexed to `pets` (sourced from each pet's manifest.json).
          items:
            type: string

    PetSpriteFrameSet:
      description: One pet's frames keyed by direction + state. All arrays are 3D hex-string arrays (frames × rows × pixels).
      type: object
      additionalProperties: false
      required: [walkDown, idleDown, walkUp, idleUp, walkRight]
      properties:
        walkDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkRight:
          type: array
          description: 3 frames at 32×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FloorTilesLoaded:
      description: Floor tile sprites (7 patterns).
      type: object
      additionalProperties: false
      required: [type, sprites]
      properties:
        type:
          const: floorTilesLoaded
        sprites:
          type: array
          description: Array of 2D hex string arrays (one per pattern).
          items:
            type: array
            items:
              type: array
              items:
                type: string

    WallTilesLoaded:
      description: Wall auto-tile sprite sets (16 bitmask pieces).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: wallTilesLoaded
        sets:
          type: array
          description: Array of wall tile sets; each set is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    CarpetTilesLoaded:
      description: Carpet auto-tile sprite sets (16 marching-squares pieces per variant).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: carpetTilesLoaded
        sets:
          type: array
          description: Array of carpet variants; each variant is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    SettingsLoaded:
      description: All persisted user-level settings, sent once on connect.
      type: object
      additionalProperties: false
      required:
        - type
        - soundEnabled
        - lastSeenVersion
        - extensionVersion
        - watchAllSessions
        - alwaysShowLabels
        - ghostHeadlessAgents
        - hooksEnabled
        - hooksInfoShown
        - externalAssetDirectories
        - showAreas
      properties:
        type:
          const: settingsLoaded
        soundEnabled:
          type: boolean
        lastSeenVersion:
          type: string
        extensionVersion:
          type: string
        watchAllSessions:
          type: boolean
        alwaysShowLabels:
          type: boolean
        ghostHeadlessAgents:
          type: boolean
        hooksEnabled:
          type: boolean
        hooksInfoShown:
          type: boolean
        externalAssetDirectories:
          type: array
          items:
            type: string
        showAreas:
          type: boolean

    HooksStatus:
      description: |
        Actual hook installation state, as opposed to the hooksEnabled
        preference in SettingsLoaded. The two can disagree: hooksEnabled
        defaults to true while first-run consent is still pending and nothing
        is installed yet. Sent after the connect handshake and whenever the
        install state changes (consent granted, settings toggle, uninstall).
      type: object
      additionalProperties: false
      required: [type, providerId, installed]
      properties:
        type:
          const: hooksStatus
        providerId:
          type: string
          description: >-
            The hook provider this install state is about (HookProvider.id,
            e.g. "claude"). Consumers keyed on install state must never mix
            one provider's status into another's — the Intro's install
            verdict in particular reads only the provider it asked about.
        installed:
          type: boolean

    HooksConsentRequest:
      description: |
        Ask this client to run the first-run hooks consent dialog. Sent during the
        `webviewReady` handshake when the hooks preference is on, consent has not
        been recorded, and nothing of ours is installed — and, in standalone, only
        on privileged (tokened) connections, since an untokened spectator could not
        act on it anyway (its `hooksConsentResponse` would be ignored).

        Carries the provider being asked about and its disclosure copy so the
        client renders the server's exact terms (the provider's
        consentDisclosure(), shared with no client-side duplicate to drift).
        The client answers with `hooksConsentResponse`, echoing the providerId;
        dismissing the dialog sends nothing and the request fires again on the
        next connect. One request per provider that needs an answer.
      type: object
      additionalProperties: false
      required: [type, providerId, headline, disclosure]
      properties:
        type:
          const: hooksConsentRequest
        providerId:
          type: string
          description: >-
            The hook provider whose install is being approved (HookProvider.id).
            The client never originates this value — it echoes it back in its
            `hooksConsentResponse`.
        headline:
          type: string
          description: One-sentence summary of what is being approved.
        disclosure:
          type: string
          description: |
            Full disclosure body (what is written, what data moves, how to undo),
            paragraphs separated by blank lines.

    AreaMappingsLoaded:
      description: |
        Workspace-folder-to-Area mappings. Folder names map to one or more Area
        labels; new agents from that folder prefer seats inside those Areas.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: areaMappingsLoaded
        mappings:
          type: object
          description: Map of folder name (string) to array of Area labels.
          additionalProperties:
            type: array
            items:
              type: string

    ExternalAssetDirectoriesUpdated:
      description: External asset directory list changed (after add/remove).
      type: object
      additionalProperties: false
      required: [type, dirs]
      properties:
        type:
          const: externalAssetDirectoriesUpdated
        dirs:
          type: array
          items:
            type: string

    WorkspaceFolders:
      description: Multi-root workspace folders (VS Code only).
      type: object
      additionalProperties: false
      required: [type, folders]
      properties:
        type:
          const: workspaceFolders
        folders:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFolder'

    AgentDiagnostics:
      description: Connection diagnostics for all agents (response to requestDiagnostics).
      type: object
      additionalProperties: false
      required: [type, agents]
      properties:
        type:
          const: agentDiagnostics
        agents:
          type: array
          description: Per-agent diagnostic info; shape opaque to the protocol.
          items:
            type: object

    # ── Client message variants ────────────────────────────────────

    WebviewReady:
      description: Client signals it's ready to receive state.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: webviewReady

    LaunchAgent:
      description: Launch a new Claude agent in a new terminal.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: launchAgent
        folderPath:
          type: string
          description: Workspace folder path (for multi-root workspaces).
        bypassPermissions:
          type: boolean

    FocusAgent:
      description: Focus an agent's terminal.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: focusAgent
        id:
          type: integer

    CloseAgent:
      description: Close (dismiss) an agent.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: closeAgent
        id:
          type: integer

    SaveAgentSeats:
      description: Persist seat assignments for current agents.
      type: object
      additionalProperties: false
      required: [type, seats]
      properties:
        type:
          const: saveAgentSeats
        seats:
          type: object
          description: Map of agent ID (string) to seat assignment.
          additionalProperties:
            $ref: '#/components/schemas/SeatAssignment'

    SaveLayout:
      description: Save the office layout to ~/.pixel-agents/layout.json.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: saveLayout
        layout:
          type: object
          description: Opaque layout object; format owned by the rendering layer.

    SetSoundEnabled:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setSoundEnabled
        enabled:
          type: boolean

    SetLastSeenVersion:
      type: object
      additionalProperties: false
      required: [type, version]
      properties:
        type:
          const: setLastSeenVersion
        version:
          type: string

    SendChat:
      description: |
        Send a chat message to the multiplayer room. Ignored when multiplayer is
        off or the relay is unreachable, and — standalone — from an untokened
        connection, which must not be able to speak as this office.
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          const: sendChat
        text:
          type: string

    JoinRoom:
      description: |
        Join the multiplayer room from the join screen. `relayUrl` (ws:// or
        wss://) changes the relay; absent = the one in `multiplayerStatus`.
        Name, room and a given relay are remembered for next time.
        Privileged-only in standalone.
      type: object
      additionalProperties: false
      required: [type, name, room]
      properties:
        type:
          const: joinRoom
        name:
          type: string
        room:
          type: string
        relayUrl:
          type: string

    LeaveRoom:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: leaveRoom

    SaveRoomLayout:
      description: |
        An edit of the room's shared map, made on revision `base`. The relay
        takes it only while `base` is still the map's revision; it lands as a
        `roomLayout` carrying `editId`, for the whole room, or comes back as
        `roomLayoutRejected`. Never written to this office's layout.json.
        Privileged-only in standalone.
      type: object
      additionalProperties: false
      required: [type, layout, base, editId]
      properties:
        type:
          const: saveRoomLayout
        layout:
          type: object
          description: Opaque OfficeLayout; the office and the relay sanitize it.
        base:
          type: integer
        editId:
          type: string
          description: The page's id for this edit (at most 64 characters).

    PresenceCharacter:
      type: object
      additionalProperties: false
      required: [id, isAvatar, pose]
      properties:
        id:
          type: integer
          description: Agent id, or 0 for the person's character while no agent drives it.
        isAvatar:
          type: boolean
        palette:
          type: integer
          description: Sprite of the person's character while no agent drives it (an agent brings its own).
        hueShift:
          type: integer
        pose:
          $ref: '#/components/schemas/RemotePose'

    PresenceUpdate:
      description: |
        Where this office's characters are in the shared room layout, and the
        desk it claimed. The webview runs the character simulation, so only it
        knows positions; the server folds them into what it publishes. Sent a
        few times a second while something moves. Privileged-only in standalone.
      type: object
      additionalProperties: false
      required: [type, characters, desk]
      properties:
        type:
          const: presenceUpdate
        characters:
          type: array
          items:
            $ref: '#/components/schemas/PresenceCharacter'
        desk:
          oneOf:
            - type: string
            - type: 'null'

    UpdateProfile:
      description: |
        Change this office's profile (any subset of the fields). Saved to
        ~/.pixel-agents/multiplayer-profile.json and published to the room.
        `look: null` goes back to an automatic character. Privileged-only in standalone.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: updateProfile
        look:
          oneOf:
            - $ref: '#/components/schemas/AvatarLook'
            - type: 'null'
        status:
          $ref: '#/components/schemas/PersonStatus'
        statusText:
          type: string
        decor:
          type: array
          items:
            $ref: '#/components/schemas/DeskDecorItem'
        shareMusic:
          type: boolean
        deskStyle:
          description: A desk style id, or null for the desk as the room built it.
          oneOf:
            - type: string
            - type: 'null'
        hidden:
          type: array
          items:
            type: string

    ConfigureCalendar:
      description: |
        Calendar feeds: add a secret iCal address (Google "Secret address in iCal
        format", Outlook "Publish calendar" ICS link; https:// or webcal://),
        remove one by id, toggle the automatic meeting status, or sync now.
        Privileged-only in standalone.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: configureCalendar
        addFeed:
          type: string
        removeFeed:
          type: string
        autoStatus:
          type: boolean
        refresh:
          type: boolean

    SpotifyCommand:
      description: |
        connect (with the person's app `clientId`) starts the sign-in; the rest
        control playback (Spotify Premium) or refresh what is playing.
        Privileged-only in standalone.
      type: object
      additionalProperties: false
      required: [type, action]
      properties:
        type:
          const: spotifyCommand
        action:
          $ref: '#/components/schemas/SpotifyAction'
        clientId:
          type: string

    SpotifyAction:
      type: string
      enum: [connect, disconnect, play, pause, next, previous, refresh]

    OpenExternal:
      description: |
        VS Code: open an https link (a meeting's join link, a song) in the
        browser or the app registered for it. The standalone page opens links itself.
      type: object
      additionalProperties: false
      required: [type, url]
      properties:
        type:
          const: openExternal
        url:
          type: string

    CopyWebLink:
      description: |
        VS Code: copy a link that opens THIS window's office in a browser, where
        meetings can use the camera, microphone and screen. The window starts
        its web view on first use (loopback only, its own token) and offers to
        open the link. The standalone page is already in a browser: ignored.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: copyWebLink

    UpdateMeetingPresence:
      description: |
        Join, update or leave (null) a meeting. Re-sent every few seconds while
        in one: the server drops a presence nobody refreshes, so a closed tab
        leaves the call. Privileged-only in standalone.
      type: object
      additionalProperties: false
      required: [type, meeting]
      properties:
        type:
          const: updateMeetingPresence
        meeting:
          oneOf:
            - $ref: '#/components/schemas/MeetingPresence'
            - type: 'null'

    SendMeetingSignal:
      description: WebRTC signaling (or an invite) to one office in the room. Privileged-only in standalone.
      type: object
      additionalProperties: false
      required: [type, to, data]
      properties:
        type:
          const: sendMeetingSignal
        to:
          type: string
          description: Receiver's peerId.
        data:
          $ref: '#/components/schemas/MeetingSignalData'

    SendMeetingEvent:
      description: Say something in the current meeting (chat, reaction, caption, notes). Privileged-only in standalone.
      type: object
      additionalProperties: false
      required: [type, event]
      properties:
        type:
          const: sendMeetingEvent
        event:
          $ref: '#/components/schemas/MeetingEventBody'

    MeetingLine:
      type: object
      additionalProperties: false
      required: [name, text, ts]
      properties:
        name:
          type: string
        text:
          type: string
        ts:
          type: integer

    GenerateMeetingNotes:
      description: |
        Write meeting notes from the transcript (and chat) with the person's own
        Claude Code (`claude -p`, no tools, no saved session), and save notes +
        transcript under ~/.pixel-agents/meetings/. Answered with
        `meetingNotesResult`. Privileged-only in standalone.
      type: object
      additionalProperties: false
      required: [type, requestId, title, transcript, chat]
      properties:
        type:
          const: generateMeetingNotes
        requestId:
          type: string
        title:
          type: string
        transcript:
          type: array
          items:
            $ref: '#/components/schemas/MeetingLine'
        chat:
          type: array
          items:
            $ref: '#/components/schemas/MeetingLine'

    UpdateGamePresence:
      description: |
        Join, update or leave (null) a match in the room. Re-sent every few
        seconds while playing: the server drops a presence nobody refreshes.
        Privileged-only in standalone.
      type: object
      additionalProperties: false
      required: [type, game]
      properties:
        type:
          const: updateGamePresence
        game:
          oneOf:
            - $ref: '#/components/schemas/GamePresence'
            - type: 'null'

    SendGameFrame:
      description: A frame for the other players of this office's match. Privileged-only in standalone.
      type: object
      additionalProperties: false
      required: [type, frame]
      properties:
        type:
          const: sendGameFrame
        frame:
          $ref: '#/components/schemas/GameFrameBody'

    SetAlwaysShowLabels:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setAlwaysShowLabels
        enabled:
          type: boolean

    SetGhostHeadlessAgents:
      description: >-
        Toggle translucent rendering for headless agents (adopted sessions with no
        terminal to focus).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setGhostHeadlessAgents
        enabled:
          type: boolean

    SetHooksEnabled:
      type: object
      additionalProperties: false
      required: [type, providerId, enabled]
      properties:
        type:
          const: setHooksEnabled
        providerId:
          type: string
          description: >-
            The hook provider being toggled (HookProvider.id). The client
            echoes the id of the hooksStatus row the checkbox renders; it
            never originates one.
        enabled:
          type: boolean

    HooksConsentResponse:
      description: |
        The user's answer to `hooksConsentRequest` — an ABSOLUTE statement of
        the state the user wants, revisable from the Intro's closing step. Only
        an exact `install` grants consent and installs; only an exact `never`
        records a durable decline and persists hooks-off (uninstalling first
        when this provider's hooks are on disk from an earlier answer).
        `notNow` writes nothing on a fresh ask, but over anything an EARLIER
        answer left behind it reverts it — uninstalling a landed install,
        clearing a recorded grant or decline — so the ask genuinely returns on
        the next connect. Any unrecognized value writes NOTHING and the user is
        asked again — a malformed choice must never be read as approval, a
        durable decline, or an uninstall trigger. The server ignores this
        message on unprivileged standalone connections, which were never sent
        the request.
      type: object
      additionalProperties: false
      required: [type, providerId, choice]
      properties:
        type:
          const: hooksConsentResponse
        providerId:
          type: string
          description: >-
            The provider this answer is about, echoed verbatim from the
            `hooksConsentRequest` that solicited it. An id naming no
            registered provider is treated exactly like a junk choice:
            write nothing.
        choice:
          $ref: '#/components/schemas/HooksConsentChoice'

    HooksConsentChoice:
      description: >-
        The three consent outcomes. Receivers must treat any other value as a
        no-op: write nothing, ask again. (An exact notNow itself is a no-op
        only on a fresh ask — over an earlier answer it is a revision that
        undoes what that answer left behind.)
      type: string
      enum: [install, notNow, never]

    SetHooksInfoShown:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: setHooksInfoShown

    SetWatchAllSessions:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setWatchAllSessions
        enabled:
          type: boolean

    ExportLayout:
      description: Trigger layout export via host-native save dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: exportLayout

    ImportLayout:
      description: Trigger layout import via host-native open dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: importLayout

    OpenSessionsFolder:
      description: Open ~/.claude/projects in the OS file manager.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: openSessionsFolder

    AddExternalAssetDirectory:
      description: >-
        Add an external asset directory. In VS Code the host shows a native
        directory picker and omits `path`; the standalone browser has no native
        picker, so it supplies an absolute `path` typed by the user.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: addExternalAssetDirectory
        path:
          type: string
          description: Absolute directory path (standalone browser only; omitted in VS Code).

    RemoveExternalAssetDirectory:
      description: Remove an external asset directory by path.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: removeExternalAssetDirectory
        path:
          type: string

    SaveAreaMappings:
      description: Persist folder-to-Area mappings for seat assignment.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: saveAreaMappings
        mappings:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    SetShowAreas:
      description: Toggle the Areas overlay (translucent rendering on top of the office).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setShowAreas
        enabled:
          type: boolean

    RequestDiagnostics:
      description: Request agent connection diagnostics (server responds with agentDiagnostics).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: requestDiagnostics

    # ── Supporting schemas ─────────────────────────────────────────

    AgentSeatMeta:
      description: |
        Seat metadata associated with an agent (palette index, hue shift, seat ID).
        Used in `existingAgents.agentMeta`. All fields optional because some agents
        may not have a seat assignment yet.
      type: object
      additionalProperties: false
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: string

    SeatAssignment:
      description: |
        Required seat assignment payload sent in `saveAgentSeats`. `seatId` may be
        null when the agent is unseated (left their chair). All other fields required.
      type: object
      additionalProperties: false
      required: [palette, hueShift, seatId]
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: [string, 'null']

    WorkspaceFolder:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string

    CharacterSpriteSet:
      description: |
        One palette's character sprites as 3D hex-string arrays (frames × rows × pixels).
        Three direction sets per palette: down, up, right (left is rendered as flipped right).
      type: object
      additionalProperties: false
      required: [down, up, right]
      properties:
        down:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        up:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        right:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FurnitureAssetMessage:
      description: One entry in the furniture catalog (sent in `furnitureAssetsLoaded`).
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - label
        - category
        - file
        - width
        - height
        - footprintW
        - footprintH
        - isDesk
        - canPlaceOnWalls
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
        category:
          type: string
        file:
          type: string
        width:
          type: integer
        height:
          type: integer
        footprintW:
          type: integer
        footprintH:
          type: integer
        isDesk:
          type: boolean
        canPlaceOnWalls:
          type: boolean
        groupId:
          type: string
        canPlaceOnSurfaces:
          type: boolean
        backgroundTiles:
          type: integer
        orientation:
          type: string
        state:
          type: string
        mirrorSide:
          type: boolean
        rotationScheme:
          type: string
        animationGroup:
          type: string
        frame:
          type: integer
